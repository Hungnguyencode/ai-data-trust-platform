services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ai-data-trust-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD is required}"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' -b -o /dev/null || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  bootstrap:
    image: ai-data-trust-platform:dev
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-data-trust-bootstrap
    command: ["python", "-m", "database.bootstrap"]
    environment:
      DB_SERVER: sqlserver
      DB_NAME: AIDataTrustPlatform
      DB_DRIVER: ODBC Driver 18 for SQL Server
      DB_TRUSTED_CONNECTION: "no"
      DB_USERNAME: sa
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: "no"

  api:
    image: ai-data-trust-platform:dev
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-data-trust-api
    ports:
      - "8000:8000"
    environment:
      DB_SERVER: sqlserver
      DB_NAME: AIDataTrustPlatform
      DB_DRIVER: ODBC Driver 18 for SQL Server
      DB_TRUSTED_CONNECTION: "no"
      DB_USERNAME: sa
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    volumes:
      - platform_data:/app/data
    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:8000/health > /dev/null || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  ui:
    image: ai-data-trust-platform:dev
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-data-trust-ui
    command:
      [
        "streamlit",
        "run",
        "app/streamlit_app.py",
        "--server.address=0.0.0.0",
        "--server.port=8501"
      ]
    ports:
      - "8501:8501"
    environment:
      DB_SERVER: sqlserver
      DB_NAME: AIDataTrustPlatform
      DB_DRIVER: ODBC Driver 18 for SQL Server
      DB_TRUSTED_CONNECTION: "no"
      DB_USERNAME: sa
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      API_BASE_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - platform_data:/app/data
    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:8501/_stcore/health > /dev/null || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: ai-data-trust-prometheus

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"

    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    ports:
      - "9090:9090"

    depends_on:
      api:
        condition: service_healthy

    restart: unless-stopped
  grafana:
    image: grafana/grafana:13.2.1
    container_name: ai-data-trust-grafana

    ports:
      - "3000:3000"

    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro

    depends_on:
      - prometheus

    restart: unless-stopped
  airflow:
    image: apache/airflow:3.3.1
    container_name: ai-data-trust-airflow

    profiles:
      - orchestration

    command: standalone

    ports:
      - "8080:8080"

    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

    volumes:
      - airflow_data:/opt/airflow
      - ./orchestration/airflow/dags:/opt/airflow/dags:ro

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:8080/api/v2/monitor/health > /dev/null || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  sqlserver_data:
  platform_data:
  prometheus_data:
  grafana_data:
  airflow_data: